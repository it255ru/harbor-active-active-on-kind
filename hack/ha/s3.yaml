# Garage on the `s3` node: S3 stand-in for Ceph RGW (backlog D4/D4a; replaces MinIO, whose images became
# private). Single node, replication_factor 1. The image is pinned by digest (backlog "Версии компонентов HA").
# Secrets (RPC secret, admin token) come from Secret s3-credentials, created by `make s3`, never committed.
# The layout, the bucket and the access key are created by hack/ha/s3-init.sh (the image has no shell: the
# `garage` CLI is run with `kubectl exec`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: harbor-deps
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "lmdb"
    replication_factor = 1

    # single node: the CLI (kubectl exec into the pod) reaches the RPC port on localhost;
    # rpc_secret and the admin token are taken from GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN
    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "us-east-1"
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "[::]:3903"
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: harbor-deps
spec:
  selector:
    app: garage
  ports:
    - {name: s3, port: 3900}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: harbor-deps
spec:
  serviceName: s3
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      nodeSelector:
        harbor-ha/role: s3
      tolerations:
        - {key: harbor-ha/role, operator: Equal, value: s3, effect: NoSchedule}
      containers:
        - name: garage
          image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
          env:
            - {name: GARAGE_RPC_SECRET, valueFrom: {secretKeyRef: {name: s3-credentials, key: rpc-secret}}}
            - {name: GARAGE_ADMIN_TOKEN, valueFrom: {secretKeyRef: {name: s3-credentials, key: admin-token}}}
          ports:
            - {name: s3, containerPort: 3900}
            - {name: rpc, containerPort: 3901}
          # no shell in the image: TCP probes only (the admin /health stays 503 until the layout exists)
          readinessProbe:
            tcpSocket: {port: 3900}
            periodSeconds: 5
          # the S3 port, not the RPC port: a bare TCP connect to the RPC port makes Garage log a
          # "Handshake error" on every probe
          livenessProbe:
            tcpSocket: {port: 3900}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/garage}
            - {name: config, mountPath: /etc/garage.toml, subPath: garage.toml}
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi

# MinIO on the `s3` node: S3 stand-in for Ceph RGW (backlog H2.5, D4). Single node, single drive.
# Credentials: Secret minio-credentials (created by `make minio`, never committed).
# Images pinned by digest (backlog "Версии компонентов HA").
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: harbor-deps
spec:
  selector:
    app: minio
  ports:
    - {name: s3, port: 9000}
    - {name: console, port: 9001}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: harbor-deps
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      nodeSelector:
        harbor-ha/role: s3
      tolerations:
        - {key: harbor-ha/role, operator: Equal, value: s3, effect: NoSchedule}
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          args: [server, /data, --console-address, ":9001"]
          env:
            - {name: MINIO_ROOT_USER, valueFrom: {secretKeyRef: {name: minio-credentials, key: root-user}}}
            - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: minio-credentials, key: root-password}}}
          ports:
            - {name: s3, containerPort: 9000}
            - {name: console, containerPort: 9001}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /minio/health/live, port: 9000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
# One-shot init: bucket for registry blobs + a bucket-scoped user for Harbor's registry. Idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: harbor-deps
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        harbor-ha/role: s3
      tolerations:
        - {key: harbor-ha/role, operator: Equal, value: s3, effect: NoSchedule}
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          command: [sh, -ec]
          args:
            - |
              export MC_CONFIG_DIR=/tmp/mc
              until mc alias set local http://minio.harbor-deps:9000 "$ROOT_USER" "$ROOT_PASSWORD"; do sleep 2; done
              mc mb --ignore-existing local/registry-blobs
              cat > /tmp/policy.json <<'POLICY'
              {"Version":"2012-10-17","Statement":[
                {"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::registry-blobs"]},
                {"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::registry-blobs/*"]}
              ]}
              POLICY
              mc admin policy create local registry-blobs-rw /tmp/policy.json
              mc admin user add local "$HARBOR_ACCESS_KEY" "$HARBOR_SECRET_KEY"
              mc admin policy attach local registry-blobs-rw --user "$HARBOR_ACCESS_KEY"
              echo init done
          env:
            - {name: ROOT_USER, valueFrom: {secretKeyRef: {name: minio-credentials, key: root-user}}}
            - {name: ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: minio-credentials, key: root-password}}}
            - {name: HARBOR_ACCESS_KEY, valueFrom: {secretKeyRef: {name: minio-credentials, key: harbor-access-key}}}
            - {name: HARBOR_SECRET_KEY, valueFrom: {secretKeyRef: {name: minio-credentials, key: harbor-secret-key}}}

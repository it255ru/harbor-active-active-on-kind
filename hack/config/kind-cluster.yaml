# 14-node KinD topology (backlog D1): 1 control-plane + 13 workers.
# Worker role = label harbor-ha/role=<role> + taint harbor-ha/role=<role>:NoSchedule,
# so only pods that tolerate and select their role land on that node.
# Worker order defines kind node names: harbor-worker, harbor-worker2, ...
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Everything (14 node containers, etcd, the S3 store, PostgreSQL) shares one host disk: a burst of I/O made
# the apiserver slow enough that controller-manager and scheduler lost their leader-election lease and
# crashed (H4.2). Longer lease/renew windows keep them alive through such stalls.
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    controllerManager:
      extraArgs:
        leader-elect-lease-duration: "60s"
        leader-elect-renew-deadline: "40s"
        leader-elect-retry-period: "10s"
    scheduler:
      extraArgs:
        leader-elect-lease-duration: "60s"
        leader-elect-renew-deadline: "40s"
        leader-elect-retry-period: "10s"
nodes:
  - role: control-plane
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "harbor-ha/role=app"
          taints:
            - key: harbor-ha/role
              value: app
              effect: NoSchedule
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "harbor-ha/role=app"
          taints:
            - key: harbor-ha/role
              value: app
              effect: NoSchedule
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "harbor-ha/role=lb"
          taints:
            - key: harbor-ha/role
              value: lb
              effect: NoSchedule
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "harbor-ha/role=lb"
          taints:
            - key: harbor-ha/role
              value: lb
              effect: NoSchedule
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "harbor-ha/role=pg"
          taints:
            - key: harbor-ha/role
              value: pg
              effect: NoSchedule
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "harbor-ha/role=pg"
          taints:
            - key: harbor-ha/role
              value: pg
              effect: NoSchedule

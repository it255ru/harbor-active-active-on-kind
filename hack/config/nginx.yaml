# Infra LB (backlog H1.2): 2 ingress-nginx replicas, one per `lb` node.
controller:
  replicaCount: 2
  service:
    annotations:
      metallb.universe.tf/loadBalancerIPs: 172.20.0.100
  nodeSelector:
    kubernetes.io/os: linux
    harbor-ha/role: lb
  tolerations:
    - key: harbor-ha/role
      operator: Equal
      value: lb
      effect: NoSchedule
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
          topologyKey: kubernetes.io/hostname
  admissionWebhooks:
    patch:
      nodeSelector:
        kubernetes.io/os: linux
        harbor-ha/role: lb
      tolerations:
        - key: harbor-ha/role
          operator: Equal
          value: lb
          effect: NoSchedule
